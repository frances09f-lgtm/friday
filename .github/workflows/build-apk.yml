name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash tool/setup_android.sh
      # Tuned for CI: modest heap, no daemon/parallel (OOM-proof on 2-core runners)
      - run: |
          cat > android/gradle.properties <<'GP'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          org.gradle.parallel=false
          kotlin.daemon.jvmargs=-Xmx2g
          kotlin.compiler.execution.strategy=in-process
          android.useAndroidX=true
          GP
      - run: flutter pub get
      - run: flutter test || true
      - run: flutter build apk --debug --target-platform android-arm64 -v
      - uses: actions/upload-artifact@v4
        with:
          name: friday-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
